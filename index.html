    <script>
      /* Set theme before first paint to avoid a flash. Mirrors ana.sh:
         stored choice wins, otherwise follow the OS preference. */
      (function () {
        try {
          var stored = localStorage.getItem("theme") || "system";
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var resolved = stored === "system" ? (prefersDark ? "dark" : "light") : stored;
          if (resolved !== "light" && resolved !== "dark") resolved = "dark";
          var el = document.documentElement;
          el.classList.remove("light", "dark");
          el.classList.add(resolved);
          el.style.colorScheme = resolved;
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
