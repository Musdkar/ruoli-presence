name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        env:
          # Vite inlines VITE_* at build time, so it must be present here,
          # not only in the Static Web App runtime settings.
          #
          # These have to be listed explicitly: the build only sees the
          # variables named in this block. A link whose variable is missing
          # builds with an empty href and renders as the dimmed, unclickable
          # tile rather than failing, so the omission is silent.
          #
          # Set the values under Settings -> Secrets and variables ->
          # Actions -> Variables (repository variables, not secrets - these end
          # up in the public bundle either way).
          VITE_VRCHAT_URL: ${{ vars.VITE_VRCHAT_URL }}
          VITE_TELEGRAM_URL: ${{ vars.VITE_TELEGRAM_URL }}
          VITE_CONTACT_URL: ${{ vars.VITE_CONTACT_URL }}
          VITE_WHATPULSE_HEATMAP_URL: ${{ vars.VITE_WHATPULSE_HEATMAP_URL }}
          VITE_WHATPULSE_PROFILE_URL: ${{ vars.VITE_WHATPULSE_PROFILE_URL }}
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ZEALOUS_DESERT_04D522500 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "/" # App source code path
          api_location: "api" # Api source code path - optional
          output_location: "dist" # Built app content directory - optional
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ZEALOUS_DESERT_04D522500 }}
          action: "close"
