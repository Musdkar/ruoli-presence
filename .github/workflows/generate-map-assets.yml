name: Generate static map assets

on:
  push:
    branches:
      - perf/v2-consolidation
    paths:
      - .github/workflows/generate-map-assets.yml
      - scripts/generate-map-assets.sh
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Prepare dedicated map avatar
        run: |
          git fetch origin main
          git show origin/main:public/assets/map-avatar.png > "$RUNNER_TEMP/map-avatar.png"
          if command -v magick >/dev/null 2>&1; then
            magick "$RUNNER_TEMP/map-avatar.png" -strip -resize '192x192>' -quality 82 public/assets/map-avatar.webp
          else
            convert "$RUNNER_TEMP/map-avatar.png" -strip -resize '192x192>' -quality 82 public/assets/map-avatar.webp
          fi
          rm -f public/assets/map-avatar.png

      - name: Generate Wuhan map assets
        run: bash scripts/generate-map-assets.sh

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/assets/
          if git diff --cached --quiet; then
            echo "Map assets are already up to date."
            exit 0
          fi
          git commit -m "assets: pre-render Wuhan map card [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
